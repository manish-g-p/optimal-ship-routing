<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nautilus · Optimal Ship Routing</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="map"></div>

  <!-- Control panel -->
  <aside class="panel panel-left glass">
    <header class="brand">
      <div class="brand-mark">🧭</div>
      <div>
        <h1>Nautilus</h1>
        <p>Optimal Ship Routing · India</p>
      </div>
    </header>

    <div class="field">
      <label>Mode</label>
      <div class="segmented" id="mode">
        <button data-val="route" class="active">Route planning</button>
        <button data-val="sim">Voyage simulation</button>
      </div>
    </div>

    <div class="field">
      <label>Vessel</label>
      <select id="vessel"></select>
      <small id="vessel-info" class="hint"></small>
    </div>

    <div class="row">
      <div class="field">
        <label>Origin</label>
        <select id="origin"></select>
      </div>
      <div class="field">
        <label>Destination</label>
        <select id="dest"></select>
      </div>
    </div>

    <div class="field">
      <label>Weather scenario</label>
      <div class="segmented" id="scenario">
        <button data-val="typical" class="active">Typical</button>
        <button data-val="rough">Rough</button>
        <button data-val="live">● Live</button>
      </div>
    </div>

    <div class="field mode-route">
      <label>Algorithms</label>
      <div class="toggles">
        <label class="chk"><input type="checkbox" id="use-dijkstra" checked />
          <span>Dijkstra <em>traditional</em></span></label>
        <label class="chk"><input type="checkbox" id="use-astar" checked />
          <span>Weather-aware A* <em>proposed</em></span></label>
        <label class="chk"><input type="checkbox" id="use-ml" checked />
          <span>ML speed model <em>drives A* cost</em></span></label>
        <label class="chk"><input type="checkbox" id="use-waves" checked />
          <span>Wave heatmap</span></label>
      </div>
    </div>

    <div class="field mode-sim hidden">
      <label>Weather change during voyage</label>
      <select id="sim-scenario"></select>
      <small class="hint">Simulated, deterministic weather changes on top of
        the Typical/Rough sea state. Live weather is not used.</small>
    </div>

    <details class="mode-sim hidden settings">
      <summary>Rerouting settings</summary>
      <div class="row">
        <div class="field">
          <label>Cooldown (steps)</label>
          <input type="number" id="cfg-cooldown" min="0" step="1" />
        </div>
        <div class="field">
          <label>Min. gain (%)</label>
          <input type="number" id="cfg-gain" min="0" step="0.5" />
        </div>
      </div>
      <div class="field">
        <label>Wave trigger (m)</label>
        <input type="number" id="cfg-swh" min="0" step="0.5" />
      </div>
      <small class="hint" id="cfg-hint"></small>
    </details>

    <button id="go" class="btn-primary mode-route">🚢 Find optimal route</button>
    <button id="simulate" class="btn-primary mode-sim hidden">⛈ Run simulated voyage</button>
    <div id="status" class="status"></div>
  </aside>

  <!-- Results panel -->
  <section class="panel panel-right glass hidden" id="results">
    <h2 id="results-title">Route comparison</h2>
    <div id="cards" class="cards"></div>
    <p id="verdict" class="verdict"></p>
    <div id="sim-extra" class="sim-extra hidden"></div>
  </section>

  <!-- Wave legend -->
  <div class="legend glass hidden" id="legend">
    <span class="legend-title">Wave height</span>
    <div class="legend-bar"></div>
    <div class="legend-scale"><span>calm</span><span id="legend-max">m</span></div>
  </div>

  <!-- Loading overlay -->
  <div id="loading" class="loading hidden">
    <div class="spinner"></div>
    <p id="loading-text">Computing optimal route…</p>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
  <script
    src="https://maps.googleapis.com/maps/api/js?key=__MAPS_KEY__&libraries=visualization,geometry&callback=initApp&loading=async"
    async defer></script>
</body>
</html>
