# Convenience wrapper around `docker build` / `docker run` for local
# development. Not required - everything here can be done with plain
# `docker` commands (see DOCKER.md) - but it saves retyping volume/port
# flags during day-to-day work on the remote server.
#
#   docker compose run --rm nautilus python -m src.evaluate
#   docker compose up nautilus-flask       # Flask UI on :8000
#   docker compose up nautilus-streamlit   # Streamlit UI on :8501

services:
  nautilus:
    build: .
    image: nautilus-dev
    # Mount the source tree so code edits on the host are reflected
    # immediately without rebuilding the image. The raw NetCDF files and
    # .venv are irrelevant inside the container and are not excluded here
    # since the bind mount only affects what's visible at /app at runtime,
    # not what gets built into the image (.dockerignore governs that).
    volumes:
      - .:/app
    working_dir: /app
    tty: true
    stdin_open: true

  nautilus-flask:
    extends: nautilus
    ports:
      - "8000:8000"
    environment:
      # Set on the host shell before `docker compose up` to enable the
      # Google Maps frontend; the API endpoints work without it.
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
    command: python server.py

  nautilus-streamlit:
    extends: nautilus
    ports:
      - "8501:8501"
    command: streamlit run app.py --server.address=0.0.0.0 --server.headless=true
