# Convenience wrapper around `docker build` / `docker run` for local
# development. Not required - everything here can be done with plain
# `docker` commands (see DOCKER.md) - but it saves retyping volume/port
# flags during day-to-day work on the remote server.
#
#   docker compose run --rm nautilus python -m src.evaluate
#   docker compose up nautilus-flask       # Flask UI on :8000
#   docker compose up nautilus-streamlit   # Streamlit UI on :8501

services:
  nautilus:
    build: .
    image: nautilus-dev
    # Mount the source tree so code edits on the host are reflected
    # immediately without rebuilding the image. The raw NetCDF files and
    # .venv are irrelevant inside the container and are not excluded here
    # since the bind mount only affects what's visible at /app at runtime,
    # not what gets built into the image (.dockerignore governs that).
    volumes:
      - .:/app
    working_dir: /app
    # Load GOOGLE_MAPS_API_KEY from a local .env if one exists;
    # `required: false` means compose doesn't error when a fresh checkout
    # has no .env yet (see .env.example). Values set here become real
    # container environment variables, so there's no conflict with
    # config.py's own load_dotenv() call - that becomes a harmless no-op
    # once compose has already populated them the same way. .env.example
    # deliberately does NOT include PORT/HOST (see its comments - setting
    # HOST there would fight the HOST=0.0.0.0 below).
    env_file:
      - path: .env
        required: false
    tty: true
    stdin_open: true

  nautilus-flask:
    extends: nautilus
    ports:
      - "8000:8000"
    environment:
      # Explicit, not from .env (see note above) - keeps the Flask dev
      # server reachable from the host regardless of what's in .env.
      - HOST=0.0.0.0
    command: python server.py

  nautilus-streamlit:
    extends: nautilus
    ports:
      - "8501:8501"
    command: streamlit run app.py --server.address=0.0.0.0 --server.headless=true
